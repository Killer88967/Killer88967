    x="0.5"
    y="0.5"
    width="899"
    height="259"
    rx="19.5"
    stroke="#30363D"
  />

  <!-- Decorative left nodes -->
  <g opacity="0.5" stroke="#70A5FD" stroke-width="1.4">
    <circle cx="72" cy="64" r="4" fill="#70A5FD"/>
    <circle cx="118" cy="101" r="4" fill="#70A5FD"/>
    <circle cx="68" cy="153" r="4" fill="#70A5FD"/>
    <circle cx="131" cy="196" r="4" fill="#70A5FD"/>

    <path d="M72 64L118 101L68 153L131 196"/>
    <path d="M72 64L68 153"/>
    <path d="M118 101L131 196"/>
  </g>

  <!-- Decorative right nodes -->
  <g opacity="0.45" stroke="#A371F7" stroke-width="1.4">
    <rect x="768" y="58" width="13" height="13" rx="2"/>
    <rect x="819" y="96" width="13" height="13" rx="2"/>
    <rect x="760" y="151" width="13" height="13" rx="2"/>
    <rect x="824" y="193" width="13" height="13" rx="2"/>

    <path d="M781 65L819 102"/>
    <path d="M768 164L824 199"/>
    <path d="M825 109L773 151"/>
