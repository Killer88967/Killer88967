<svg width="900" height="260" viewBox="0 0 900 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accent" x1="150" y1="40" x2="760" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#70A5FD"/>
      <stop offset="0.55" stop-color="#A371F7"/>
      <stop offset="1" stop-color="#57F287"/>
    </linearGradient>

    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(450 130) rotate(90) scale(150 450)">
      <stop stop-color="#70A5FD" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#70A5FD" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path
        d="M36 0H0V36"
        fill="none"
        stroke="#30363D"
        stroke-width="1"
        stroke-opacity="0.28"
      />
    </pattern>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="260" rx="20" fill="#0D1117"/>
  <rect width="900" height="260" rx="20" fill="url(#grid)"/>
  <rect width="900" height="260" rx="20" fill="url(#glow)"/>

  <!-- Border -->
  <rect
    x="0.5"
    y="0.5"
    width="899"
    height="259"
    rx="19.5"
    stroke="#30363D"
  />

  <!-- Decorative left nodes -->
  <g opacity="0.5" stroke="#70A5FD" stroke-width="1.4">
    <circle cx="72" cy="64" r="4" fill="#70A5FD"/>
    <circle cx="118" cy="101" r="4" fill="#70A5FD"/>
    <circle cx="68" cy="153" r="4" fill="#70A5FD"/>
    <circle cx="131" cy="196" r="4" fill="#70A5FD"/>

    <path d="M72 64L118 101L68 153L131 196"/>
    <path d="M72 64L68 153"/>
    <path d="M118 101L131 196"/>
  </g>

  <!-- Decorative right nodes -->
  <g opacity="0.45" stroke="#A371F7" stroke-width="1.4">
    <rect x="768" y="58" width="13" height="13" rx="2"/>
    <rect x="819" y="96" width="13" height="13" rx="2"/>
    <rect x="760" y="151" width="13" height="13" rx="2"/>
    <rect x="824" y="193" width="13" height="13" rx="2"/>

    <path d="M781 65L819 102"/>
    <path d="M768 164L824 199"/>
    <path d="M825 109L773 151"/>
  </g>

  <!-- Tiny database motif -->
  <g transform="translate(164 184)" opacity="0.65">
    <ellipse cx="18" cy="5" rx="14" ry="5" stroke="#70A5FD" stroke-width="1.5"/>
    <path
      d="M4 5V21C4 24 10 26 18 26C26 26 32 24 32 21V5"
      stroke="#70A5FD"
      stroke-width="1.5"
    />
    <path
      d="M4 13C4 16 10 18 18 18C26 18 32 16 32 13"
      stroke="#70A5FD"
      stroke-width="1.2"
    />
  </g>

  <!-- Tiny code motif -->
  <g
    transform="translate(690 184)"
    stroke="#57F287"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.65"
  >
    <path d="M10 2L2 10L10 18"/>
    <path d="M26 2L34 10L26 18"/>
    <path d="M21 0L15 20"/>
  </g>

  <!-- Center symbol -->
  <g transform="translate(424 30)" filter="url(#softGlow)">
    <rect
      x="0"
      y="0"
      width="52"
      height="52"
      rx="13"
      fill="#161B22"
      stroke="#70A5FD"
      stroke-width="1.5"
    />

    <path
      d="M12 14H23V25H12V14ZM29 14H40V25H29V14ZM21 19.5H31M17.5 25V34M34.5 25V34M12 34H23V40H12V34ZM29 34H40V40H29V34ZM21 37H31"
      stroke="url(#accent)"
      stroke-width="1.7"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Main title -->
  <text
    x="450"
    y="122"
    text-anchor="middle"
    fill="#F0F6FC"
    font-family="Arial, Helvetica, sans-serif"
    font-size="46"
    font-weight="800"
    letter-spacing="2"
  >
    KILLER88967
  </text>

  <!-- Accent underline -->
  <rect
    x="335"
    y="137"
    width="230"
    height="3"
    rx="1.5"
    fill="url(#accent)"
  />

  <!-- Subtitle -->
  <text
    x="450"
    y="170"
    text-anchor="middle"
    fill="#8B949E"
    font-family="Arial, Helvetica, sans-serif"
    font-size="17"
    font-weight="600"
    letter-spacing="0.5"
  >
    Full Stack Developer · Tooling · Game Development
  </text>

  <!-- Bottom phrase -->
  <text
    x="450"
    y="211"
    text-anchor="middle"
    fill="#70A5FD"
    font-family="Arial, Helvetica, sans-serif"
    font-size="14"
    font-weight="600"
  >
    BUILD · BREAK · LEARN · REPEAT
  </text>
</svg>