<svg width="900" height="260" viewBox="0 0 900 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accent" x1="150" y1="40" x2="760" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#70A5FD"/>
      <stop offset="0.55" stop-color="#A371F7"/>
      <stop offset="1" stop-color="#57F287"/>
    </linearGradient>

    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(450 130) rotate(90) scale(150 450)">
      <stop stop-color="#70A5FD" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#70A5FD" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path
        d="M36 0H0V36"
        fill="none"
        stroke="#30363D"
        stroke-width="1"
        stroke-opacity="0.28"
      />
    </pattern>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="260" rx="20" fill="#0D1117"/>
  <rect width="900" height="260" rx="20" fill="url(#grid)"/>
  <rect width="900" height="260" rx="20" fill="url(#glow)"/>

  <!-- Border -->
